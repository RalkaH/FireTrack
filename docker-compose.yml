services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./fire_extinguishers.db
      # Задайте свои значения (например, в файле .env рядом с docker-compose.yml)
      - SECRET_KEY=${SECRET_KEY:-change-me-dev-secret-key}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
    volumes:
      - .:/app
    restart: always
