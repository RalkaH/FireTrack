<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>FireTrack — Учет огнетушителей</title>

  <!-- Responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="/static/favicon.ico">

  <!-- Our styles -->
  <link rel="stylesheet" href="/static/css/style.css">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.min.css">

  <style>
    body {
      padding-top: 70px;
      background: var(--bg-primary);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>

<body class="app-shell">
  <!-- Navigation -->
  <nav class="navbar navbar-expand-xl fixed-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="#">
        <i class="bi bi-fire"></i>
        <span>FireTrack</span>
      </a>

      <!-- Mobile toggle -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMain">
        <!-- Left nav items -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="#" data-page="dashboard">
              <i class="bi bi-speedometer2 me-1"></i> Дашборд
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" data-page="extinguishers">
              <i class="bi bi-droplet me-1"></i> Огнетушители
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" data-page="locations">
              <i class="bi bi-geo-alt me-1"></i> Места
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" data-page="employees">
              <i class="bi bi-people me-1"></i> Сотрудники
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" data-page="inspections">
              <i class="bi bi-clipboard-check me-1"></i> Журнал проверок
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" data-page="reports">
              <i class="bi bi-printer me-1"></i> Отчёты
            </a>
          </li>
          <li class="nav-item requires-edit">
            <a class="nav-link" href="#" data-page="import">
              <i class="bi bi-upload me-1"></i> Импорт
            </a>
          </li>
          <li class="nav-item dropdown requires-admin">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" id="adminMenu"
               aria-expanded="false" data-group="admin">
              <i class="bi bi-shield-lock me-1"></i> Администрирование
            </a>
            <ul class="dropdown-menu" aria-labelledby="adminMenu">
              <li><a class="dropdown-item" href="#" data-page="users"><i class="bi bi-person-gear me-2"></i>Пользователи</a></li>
              <li><a class="dropdown-item" href="#" data-page="audit"><i class="bi bi-journal-text me-2"></i>Журнал действий</a></li>
              <li><a class="dropdown-item" href="#" data-page="settings"><i class="bi bi-sliders me-2"></i>Настройки</a></li>
            </ul>
          </li>
        </ul>

        <!-- Right: current user menu + logout -->
        <div class="dropdown me-3">
          <button class="nav-user nav-user-btn dropdown-toggle" type="button" data-bs-toggle="dropdown"
                  id="currentUser" title="" aria-expanded="false"></button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="currentUser">
            <li><a class="dropdown-item" href="#" onclick="showChangePasswordModal(false); return false;">
              <i class="bi bi-key me-2"></i>Сменить пароль</a></li>
          </ul>
        </div>
        <button class="btn-logout" onclick="API.logout()">
          <i class="bi bi-box-arrow-right me-1"></i> Выход
        </button>
      </div>
    </div>
  </nav>

  <!-- Main content area -->
  <main class="container-fluid mt-4 mb-5 px-4">
    <div id="content"></div>
  </main>

  <!-- Universal Modal -->
  <div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>
  </div>

  <!-- Смена пароля: отдельное окно, чтобы при обязательной смене его нельзя было закрыть
       и чтобы оно не затирало форму в общем окне -->
  <div class="modal fade" id="passwordModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-key me-2"></i>Смена пароля</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="passwordModalBody"></div>
      </div>
    </div>
  </div>

  <!-- Toast container for notifications -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999;"></div>

  <!-- Bootstrap JS -->
  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>

  <!-- App scripts -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/dashboard.js"></script>
  <script src="/static/js/extinguishers.js"></script>
  <script src="/static/js/locations.js"></script>
  <script src="/static/js/employees.js"></script>
  <script src="/static/js/inspections.js"></script>
  <script src="/static/js/import.js"></script>
  <script src="/static/js/reports.js"></script>
  <script src="/static/js/account.js"></script>
  <script src="/static/js/users.js"></script>
  <script src="/static/js/audit.js"></script>
  <script src="/static/js/settings.js"></script>

  <script>
    // ── Global state ──
    let isRecalculating = false;
    let currentUser = null;

    const ROLE_NAMES = {
      admin: 'Администратор',
      engineer: 'Инженер',
      viewer: 'Наблюдатель'
    };

    // Может ли текущий пользователь вносить изменения
    function canEdit() {
      return currentUser && (currentUser.role === 'admin' || currentUser.role === 'engineer');
    }

    function isAdmin() {
      return currentUser && currentUser.role === 'admin';
    }

    // Страницы, доступные только администратору (сервер всё равно проверяет права)
    const ADMIN_PAGES = ['users', 'audit', 'settings'];

    // Переход на страницу с подсветкой пункта меню
    function navigateTo(page) {
      if (ADMIN_PAGES.includes(page) && !isAdmin()) page = 'dashboard';
      document.querySelectorAll('.navbar .nav-link[data-page], .navbar .dropdown-item[data-page]').forEach(l => {
        l.classList.toggle('active', l.getAttribute('data-page') === page);
      });
      const adminMenu = document.getElementById('adminMenu');
      if (adminMenu) adminMenu.classList.toggle('active', ADMIN_PAGES.includes(page));
      // Свернуть мобильное меню после выбора пункта
      const collapse = document.getElementById('navbarMain');
      if (collapse && collapse.classList.contains('show')) bootstrap.Collapse.getOrCreateInstance(collapse).hide();
      loadPage(page);
    }

    // ── Page router ──
    function loadPage(page) {
      // Add fade-out effect
      const content = document.getElementById('content');
      content.style.opacity = '0';
      content.style.transform = 'translateY(8px)';
      content.style.transition = 'opacity 0.2s ease, transform 0.2s ease';

      setTimeout(() => {
        if (page === 'dashboard') loadDashboard();
        else if (page === 'extinguishers') loadExtinguishers();
        else if (page === 'locations') loadLocations();
        else if (page === 'employees') loadEmployees();
        else if (page === 'inspections') loadInspections();
        else if (page === 'import') loadImportPage();
        else if (page === 'reports') loadReportsPage();
        else if (page === 'users') loadUsers();
        else if (page === 'audit') loadAuditPage();
        else if (page === 'settings') loadSettingsPage();

        // Fade in
        requestAnimationFrame(() => {
          content.style.opacity = '1';
          content.style.transform = 'translateY(0)';
        });
      }, 200);
    }

    // ── Toast notification system ──
    function showAlert(message, type = 'info') {
      const container = document.querySelector('.toast-container');
      const toastId = 'toast-' + Date.now();

      const icons = {
        success: 'bi-check-circle-fill',
        danger: 'bi-exclamation-triangle-fill',
        warning: 'bi-exclamation-circle-fill',
        info: 'bi-info-circle-fill'
      };

      const toastHtml = `
        <div id="${toastId}" class="toast align-items-center border-0 show" role="alert"
             style="background: var(--bg-card-dark); color: var(--text-white); border-radius: var(--radius-md);
                    box-shadow: var(--shadow-xl); margin-bottom: 0.5rem; animation: slideInRight 0.3s ease-out;
                    border: 1px solid var(--bg-glass-border);">
          <div class="d-flex align-items-center" style="padding: 0.75rem 1rem;">
            <i class="bi ${icons[type] || icons.info} me-2" style="color: var(--accent);"></i>
            <div class="toast-body" style="padding: 0; font-size: 0.9rem;">${esc(message)}</div>
            <button type="button" class="btn-close btn-close-white ms-3" data-bs-dismiss="toast"
                    style="font-size: 0.7rem; opacity: 0.6;"></button>
          </div>
        </div>
      `;

      container.insertAdjacentHTML('beforeend', toastHtml);

      // Auto-dismiss
      setTimeout(() => {
        const toast = document.getElementById(toastId);
        if (toast) {
          toast.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
          toast.style.opacity = '0';
          toast.style.transform = 'translateX(100%)';
          setTimeout(() => toast.remove(), 300);
        }
      }, 4000);
    }

    // ── Initialize app ──
    document.addEventListener('DOMContentLoaded', async () => {
      // Check auth: токен должен быть и не должен быть просрочен
      if (!startSessionWatcher()) return;

      // Nav click handlers (пункты меню и выпадающих списков с data-page)
      document.querySelectorAll('.navbar [data-page]').forEach(link => {
        link.addEventListener('click', function (e) {
          e.preventDefault();
          navigateTo(this.getAttribute('data-page'));
        });
      });

      // Ссылки data-page внутри контента (кнопки «Показать все» и т.п.)
      document.getElementById('content').addEventListener('click', (e) => {
        const link = e.target.closest('[data-page]');
        if (!link) return;
        e.preventDefault();
        if (link.dataset.statusFilter) pendingStatusFilter = link.dataset.statusFilter;
        navigateTo(link.getAttribute('data-page'));
      });

      // Кто вошёл (заодно проверяем токен на сервере)
      try {
        currentUser = await API.getMe();
        const userEl = document.getElementById('currentUser');
        userEl.innerHTML = `<i class="bi bi-person-circle me-1"></i>${esc(currentUser.full_name || currentUser.username)}`
          + ` <span class="nav-user-role">${esc(ROLE_NAMES[currentUser.role] || currentUser.role)}</span>`;
        userEl.title = currentUser.username;
        document.body.classList.add('role-' + currentUser.role);
      } catch (error) {
        // При 401 authorizedFetch уже отправил на страницу входа
        if (!sessionRedirecting) showAlert('Не удалось получить данные пользователя: ' + error.message, 'danger');
        return;
      }

      // Временный пароль или admin123: сначала смена пароля, потом работа
      if (currentUser.must_change_password) {
        document.getElementById('content').innerHTML = `
          <div class="empty-state" style="color: var(--text-light);">
            <i class="bi bi-shield-lock"></i>
            <p>Чтобы продолжить, смените пароль</p>
          </div>`;
        showChangePasswordModal(true);
        return;
      }

      // Load default page
      loadDashboard();
    });
  </script>
</body>

</html>
