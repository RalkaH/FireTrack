# alembic.ini (v1.0)
# Миграции схемы базы FireTrack.
# Обычно запускать руками ничего не нужно: приложение само выполняет
# `upgrade head` при старте (см. migrate.py). Команды для разработки:
#   alembic revision -m "описание"   новая ревизия
#   alembic upgrade head             обновить базу до последней версии
#   alembic current                  текущая версия базы
# URL базы берется из DATABASE_URL (db.py), здесь его указывать не нужно.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
